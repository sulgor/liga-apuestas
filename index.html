<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<meta name="theme-color" content="#0e0e0e"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<title>Liga de Apuestas</title>
<link rel="manifest" href="manifest.json"/>
<link rel="icon" href="icon-192.png"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/tabler-icons.min.css"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#0e0e0e;--bg2:#1a1a1a;--bg3:#222;--bg4:#2a2a2a;
  --border:#2e2e2e;--border2:#3a3a3a;
  --txt:#e8e8e8;--txt2:#999;--txt3:#555;
  --green:#639922;--green-l:#97C459;--green-d:#3B6D11;
  --green-bg:#1a2410;
  --red:#c0392b;--red-l:#f07070;--red-bg:#2a1010;
}
html,body{height:100%;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;overscroll-behavior:none;}
#app{height:100%;display:flex;flex-direction:column;max-width:480px;margin:0 auto;}

/* Views */
.view{display:none;flex-direction:column;height:100%;overflow:hidden;}
.view.active{display:flex;}

/* Header */
.hdr{background:var(--bg2);border-bottom:1px solid var(--border);padding:env(safe-area-inset-top,12px) 16px 0;flex-shrink:0;}
.hdr-top{display:flex;align-items:center;justify-content:space-between;padding-top:12px;margin-bottom:12px;}
.hdr-title{font-size:17px;font-weight:600;color:var(--txt);}
.hdr-sub{font-size:12px;color:var(--txt2);}
.dot{width:9px;height:9px;border-radius:50%;background:var(--green);}
.tabs{display:flex;}
.tab{flex:1;padding:8px 4px 10px;font-size:10px;font-weight:500;border:none;background:none;cursor:pointer;color:var(--txt2);border-bottom:2px solid transparent;text-align:center;line-height:1.4;letter-spacing:.02em;}
.tab.active{color:var(--green-l);border-bottom-color:var(--green);}
.tab i{display:block;font-size:20px;margin-bottom:2px;}

/* Sub header (form screens) */
.sub-hdr{background:var(--bg2);border-bottom:1px solid var(--border);padding:env(safe-area-inset-top,12px) 16px 14px;display:flex;align-items:flex-end;gap:12px;flex-shrink:0;padding-top:calc(env(safe-area-inset-top,0px) + 12px);}
.back-btn{background:none;border:none;cursor:pointer;color:var(--txt2);font-size:24px;padding:0;line-height:1;display:flex;align-items:center;}
.sub-title{font-size:17px;font-weight:600;}

/* Scrollable content */
.scroll{flex:1;overflow-y:auto;padding:14px;-webkit-overflow-scrolling:touch;}
.scroll-bottom{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 24px);}

/* Cards */
.card{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:10px;}
.card-title{font-size:12px;font-weight:500;color:var(--txt2);text-transform:uppercase;letter-spacing:.05em;margin-bottom:12px;}

/* Form elements */
label{font-size:12px;color:var(--txt2);display:block;margin-bottom:4px;}
input,select,textarea{width:100%;padding:10px 12px;font-size:15px;border:1px solid var(--border2);border-radius:10px;background:var(--bg3);color:var(--txt);margin-bottom:10px;font-family:inherit;-webkit-appearance:none;outline:none;transition:border-color .15s;}
input:focus,select:focus{border-color:var(--green);}
input[type="file"]{display:none;}
select option{background:var(--bg3);}
.input-ok{border-color:var(--green)!important;background:#1a2410!important;}

/* Buttons */
.btn{padding:10px 16px;border-radius:10px;border:1px solid var(--border2);background:none;cursor:pointer;font-size:14px;color:var(--txt);font-family:inherit;transition:opacity .15s;display:inline-flex;align-items:center;gap:6px;}
.btn:active{opacity:.7;}
.btn-g{background:var(--green);border-color:var(--green);color:#fff;font-weight:500;}
.btn-r{border-color:var(--red);color:var(--red-l);}
.btn-full{width:100%;justify-content:center;padding:13px;}
.btn-sm{padding:5px 10px;font-size:12px;border-radius:8px;}

/* Rows */
.rank-row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--border);}
.rank-row:last-child{border-bottom:none;}
.irow{display:flex;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--border);font-size:14px;}
.irow:last-child{border-bottom:none;}
.bet-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);}
.bet-row:last-child{border-bottom:none;}

/* Avatar */
.ava{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:600;flex-shrink:0;}

/* Badge */
.badge{display:inline-block;padding:3px 9px;border-radius:99px;font-size:10px;font-weight:600;}
.bw{background:var(--green-bg);color:var(--green-l);}
.bl{background:var(--red-bg);color:var(--red-l);}
.bp{background:var(--bg3);color:var(--txt2);}

/* Stats grid */
.sg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;}
.sb{background:var(--bg3);border-radius:10px;padding:12px 10px;}
.sb-l{font-size:11px;color:var(--txt2);margin-bottom:2px;}
.sb-v{font-size:24px;font-weight:600;}

/* Chips */
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;}
.chip{padding:5px 13px;border-radius:99px;font-size:12px;border:1px solid var(--border2);background:var(--bg2);cursor:pointer;color:var(--txt2);}
.chip.active{background:var(--green);border-color:var(--green);color:#fff;font-weight:500;}

/* Photo zone */
.photo-zone{border:1.5px dashed var(--border2);border-radius:10px;padding:20px 16px;text-align:center;cursor:pointer;margin-bottom:10px;transition:border-color .2s;}
.photo-zone:active{border-color:var(--green);}
.photo-zone img{max-height:140px;width:100%;object-fit:contain;border-radius:8px;}

/* AI status box */
.ai-box{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:10px;margin-bottom:10px;font-size:13px;}
.ai-loading{background:#1c2213;color:var(--green-l);}
.ai-ok{background:var(--green-bg);color:var(--green-l);}
.ai-err{background:var(--red-bg);color:var(--red-l);}
@keyframes spin{to{transform:rotate(360deg);}}
.spin{display:inline-block;animation:spin 1s linear infinite;}
.ai-pill{position:absolute;right:10px;top:11px;font-size:10px;background:var(--green-bg);color:var(--green-l);padding:2px 7px;border-radius:99px;display:none;font-weight:600;}
.gain-wrap{position:relative;}

/* Colors */
.cg{color:var(--green-l);}
.cr{color:var(--red-l);}

/* Empty */
.empty{text-align:center;padding:3rem 1rem;color:var(--txt2);}
.empty i{font-size:40px;display:block;margin-bottom:10px;color:var(--txt3);}

/* Result action buttons */
.res-btn{width:100%;padding:14px 16px;border-radius:12px;border:1px solid var(--border2);background:var(--bg3);cursor:pointer;font-size:15px;color:var(--txt);font-family:inherit;margin-bottom:8px;text-align:left;display:flex;align-items:center;gap:10px;transition:background .15s;}
.res-btn:active{background:var(--bg4);}
.res-btn-won{border-color:var(--green);color:var(--green-l);}
.res-btn-lost{border-color:var(--red);color:var(--red-l);}



/* API key notice */
.api-notice{background:#1a1500;border:1px solid #4a3800;border-radius:10px;padding:10px 12px;font-size:12px;color:#c8a020;margin-bottom:10px;}
</style>
</head>
<body>
<div id="app">

<!-- ====== MAIN VIEW ====== -->
<div class="view active" id="v-main">
  <div class="hdr">
    <div class="hdr-top">
      <div>
        <div class="hdr-title" id="hdr-name">Liga de Apuestas</div>
        <div class="hdr-sub" id="hdr-season">Temporada</div>
      </div>
      <div class="dot"></div>
    </div>
    <div class="tabs">
      <button class="tab active" id="tab-ranking" onclick="showTab('ranking')"><i class="ti ti-trophy"></i>Ranking</button>
      <button class="tab" id="tab-history" onclick="showTab('history')"><i class="ti ti-list"></i>Historial</button>
      <button class="tab" id="tab-stats" onclick="showTab('stats')"><i class="ti ti-chart-bar"></i>Stats</button>
      <button class="tab" id="tab-admin" onclick="showTab('admin')"><i class="ti ti-shield"></i>Admin</button>
    </div>
  </div>

  <div class="scroll scroll-bottom" id="tab-content"></div>
</div>

<!-- ====== AÑADIR JUGADOR ====== -->
<div class="view" id="v-addplayer">
  <div class="sub-hdr">
    <button class="back-btn" onclick="goMain()"><i class="ti ti-arrow-left"></i></button>
    <div class="sub-title">Nuevo jugador</div>
  </div>
  <div class="scroll scroll-bottom">
    <div class="card">
      <label>Nombre del jugador</label>
      <input type="text" id="np-name" placeholder="Ej: Mikel" autocomplete="off"/>
      <button class="btn btn-g btn-full" onclick="savePlayer()">Añadir jugador</button>
    </div>
  </div>
</div>

<!-- ====== NUEVA APUESTA ====== -->
<div class="view" id="v-addbet">
  <div class="sub-hdr">
    <button class="back-btn" onclick="goMain()"><i class="ti ti-arrow-left"></i></button>
    <div class="sub-title">Nueva apuesta</div>
  </div>
  <div class="scroll scroll-bottom">
    <div class="card">
      <div class="card-title">Foto del ticket</div>
      <div class="photo-zone" id="photo-zone" onclick="document.getElementById('nb-photo').click()">
        <i class="ti ti-camera" style="font-size:32px;color:var(--txt2);display:block;margin-bottom:6px;"></i>
        <div style="font-size:14px;color:var(--txt2);">Toca para subir la foto</div>
        <div style="font-size:12px;color:var(--txt3);margin-top:4px;">La IA leerá la ganancia automáticamente</div>
      </div>
      <input type="file" id="nb-photo" accept="image/*" onchange="onPhoto(this)"/>
      <div id="ai-status" style="display:none;"></div>
    </div>
    <div class="card">
      <div class="card-title">Datos de la apuesta</div>
      <label>Jugador</label>
      <select id="nb-player"><option value="">Seleccionar jugador...</option></select>
      <label>Descripción</label>
      <input type="text" id="nb-desc" placeholder="Ej: Real Madrid gana al Barça" autocomplete="off"/>
      <label>Importe apostado (€)</label>
      <input type="number" id="nb-stake" value="1.00" step="0.01" min="0" readonly style="opacity:.6;cursor:not-allowed;"/>
      <label>Ganancia total si acierta (€)</label>
      <div class="gain-wrap">
        <input type="number" id="nb-gain" placeholder="0.00" step="0.01" min="0"/>
        <div class="ai-pill" id="ai-badge">IA ✓</div>
      </div>
      <label>Fecha</label>
      <input type="date" id="nb-date"/>
      <button class="btn btn-g btn-full" style="margin-top:4px;" onclick="saveBet()">
        <i class="ti ti-check"></i> Guardar apuesta
      </button>
    </div>
  </div>
</div>

<!-- ====== MARCAR RESULTADO ====== -->
<div class="view" id="v-result">
  <div class="sub-hdr">
    <button class="back-btn" onclick="goMain()"><i class="ti ti-arrow-left"></i></button>
    <div class="sub-title">Marcar resultado</div>
  </div>
  <div class="scroll scroll-bottom">
    <div class="card" style="margin-bottom:14px;">
      <div style="font-size:12px;color:var(--txt2);margin-bottom:4px;">Apuesta</div>
      <div id="result-desc" style="font-size:15px;font-weight:500;"></div>
      <div id="result-sub" style="font-size:13px;color:var(--txt2);margin-top:4px;"></div>
    </div>
    <button class="res-btn res-btn-won" onclick="setResult('won')"><i class="ti ti-circle-check" style="font-size:20px;"></i> Acertada — ¡Ganó!</button>
    <button class="res-btn res-btn-lost" onclick="setResult('lost')"><i class="ti ti-circle-x" style="font-size:20px;"></i> Fallada — Perdió</button>
    <button class="res-btn" onclick="setResult('pending')"><i class="ti ti-clock" style="font-size:20px;color:var(--txt2);"></i> Dejar pendiente</button>
  </div>
</div>

</div><!-- #app -->

<script>
// ─── Storage ────────────────────────────────────────────
const SK = 'liga-apuestas-v1';
function loadData() {
  try { return JSON.parse(localStorage.getItem(SK)) || defaultData(); } catch(e) { return defaultData(); }
}
function defaultData() {
  return { players:[], bets:[], cfg:{ name:'Liga de Apuestas', season:'Temporada 2024/25', apiKey:'' } };
}
function saveData() { localStorage.setItem(SK, JSON.stringify(D)); }

let D = loadData();
let authed = false, histFilt = null, statsFilt = null, curTab = 'ranking', curBetId = null, curPhoto = null;

// ─── Service Worker ──────────────────────────────────────
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}



// ─── Navigation ──────────────────────────────────────────
function showView(id) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0, 0);
}
function goMain() { showView('v-main'); renderTab(); }
function showTab(t) {
  curTab = t;
  document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
  document.getElementById('tab-' + t).classList.add('active');
  renderTab();
}
function renderTab() {
  const el = document.getElementById('tab-content');
  if (curTab === 'ranking') el.innerHTML = renderRanking();
  else if (curTab === 'history') el.innerHTML = renderHistory();
  else if (curTab === 'stats') el.innerHTML = renderStats();
  else if (curTab === 'admin') el.innerHTML = renderAdmin();
}

// ─── Helpers ─────────────────────────────────────────────
const AC = [
  {bg:'#1a2e1a',tx:'#97C459'},{bg:'#0e1e30',tx:'#7ab8f5'},
  {bg:'#2e1e0a',tx:'#f0a050'},{bg:'#2a0e1e',tx:'#f07ab0'},
  {bg:'#0a2018',tx:'#50c090'},{bg:'#1e0e30',tx:'#a090f0'},
  {bg:'#2e1008',tx:'#f08060'},{bg:'#2a0808',tx:'#f07070'},
  {bg:'#1e1a08',tx:'#d4b860'},{bg:'#081a2e',tx:'#60a8d4'},
];
function av(i) { return AC[i % AC.length]; }
function ini(n) { return (n||'?').split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2); }
function fmt(n) { return parseFloat(n||0).toFixed(2); }

function pStats(pid) {
  const bs = D.bets.filter(b => b.pid === pid);
  const won = bs.filter(b => b.res === 'won'), lost = bs.filter(b => b.res === 'lost');
  const tot = won.length + lost.length, pct = tot > 0 ? Math.round(won.length / tot * 100) : 0;
  const totalGain = won.reduce((s,b) => s + (b.gain||0), 0);
  const totalStake = won.length + lost.length; // 1€ per bet
  const net = +(totalGain - lost.length).toFixed(2);
  const res = [...bs].filter(b => b.res !== 'pending').sort((a,b) => new Date(b.date)-new Date(a.date));
  let streak = 0, stype = null;
  for (const b of res) { if (!stype){stype=b.res;streak=1;} else if(b.res===stype) streak++; else break; }
  return { bs, won:won.length, lost:lost.length, tot, pct, net, streak, stype, pending:bs.filter(b=>b.res==='pending').length };
}
function ranking() {
  return D.players.map((p,i) => ({...p, idx:i, ...pStats(p.id)})).sort((a,b) => b.net - a.net);
}

// ─── Ranking ─────────────────────────────────────────────
function renderRanking() {
  const r = ranking();
  if (!r.length) return '<div class="empty"><i class="ti ti-trophy"></i>Sin jugadores todavía<br><small style="margin-top:6px;display:block;">El admin puede añadirlos</small></div>';
  const M = ['🥇','🥈','🥉'];
  return '<div class="card">' + r.map((p,i) => {
    const ac = av(p.idx);
    const med = i<3 ? `<span style="font-size:20px;">${M[i]}</span>` : `<span style="font-size:12px;color:var(--txt2);width:24px;text-align:center;">${i+1}º</span>`;
    const cls = p.net >= 0 ? 'cg' : 'cr', sgn = p.net >= 0 ? '+' : '';
    return `<div class="rank-row" style="cursor:pointer;" onclick="quickStats('${p.id}')">
      ${med}
      <div class="ava" style="width:40px;height:40px;font-size:14px;background:${ac.bg};color:${ac.tx};">${ini(p.name)}</div>
      <div style="flex:1;min-width:0;">
        <div style="font-size:15px;font-weight:500;">${p.name}</div>
        <div style="font-size:12px;color:var(--txt2);">${p.won}✓ ${p.lost}✗ · ${p.pct}% acierto</div>
      </div>
      <div class="${cls}" style="font-size:16px;font-weight:600;">${sgn}${fmt(p.net)}€</div>
    </div>`;
  }).join('') + '</div>';
}
function quickStats(id) { statsFilt = id; showTab('stats'); }

// ─── History ─────────────────────────────────────────────
function renderHistory() {
  const chips = `<div class="chips"><div class="chip ${histFilt===null?'active':''}" onclick="setHF(null)">Todos</div>` +
    D.players.map(p => `<div class="chip ${histFilt===p.id?'active':''}" onclick="setHF('${p.id}')">${p.name}</div>`).join('') + '</div>';
  const bets = [...D.bets].filter(b => !histFilt || b.pid===histFilt).sort((a,b) => new Date(b.date)-new Date(a.date));
  if (!bets.length) return chips + '<div class="empty"><i class="ti ti-list"></i>Sin apuestas todavía</div>';
  const rows = bets.map(b => {
    const pl = D.players.find(p => p.id===b.pid);
    const lbl = b.res==='won'?'Acertada':b.res==='lost'?'Fallada':'Pendiente';
    const bc = b.res==='won'?'bw':b.res==='lost'?'bl':'bp';
    const net = b.res==='won' ? `+${fmt(b.gain-1)}€` : b.res==='lost' ? '-1.00€' : `pot. +${fmt(b.gain)}€`;
    const nc = b.res==='won'?'cg':b.res==='lost'?'cr':'';
    const ph = b.photo ? `<img src="${b.photo}" class="ava" style="width:44px;height:44px;border-radius:8px;object-fit:cover;" alt="ticket"/>` :
      `<div class="ava" style="width:44px;height:44px;border-radius:8px;background:var(--bg3);"><i class="ti ti-photo" style="color:var(--txt2);font-size:18px;"></i></div>`;
    return `<div class="bet-row">${ph}
      <div style="flex:1;min-width:0;">
        <div style="font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${b.desc||'Sin descripción'}</div>
        <div style="font-size:12px;color:var(--txt2);">${pl?.name||'?'} · ${b.date||''} · apostado: ${fmt(b.stake||1)}€</div>
      </div>
      <div style="text-align:right;flex-shrink:0;">
        <span class="badge ${bc}">${lbl}</span>
        <div style="font-size:12px;font-weight:600;margin-top:3px;" class="${nc}">${net}</div>
      </div>
    </div>`;
  }).join('');
  return chips + '<div class="card">' + rows + '</div>';
}
function setHF(id) { histFilt = id; if(curTab==='history') renderTab(); }

// ─── Stats ───────────────────────────────────────────────
function renderStats() {
  const chips = '<div class="chips">' +
    D.players.map(p => `<div class="chip ${statsFilt===p.id?'active':''}" onclick="setSF('${p.id}')">${p.name}</div>`).join('') + '</div>';
  if (!statsFilt && D.players.length) statsFilt = D.players[0].id;
  if (!statsFilt) return chips + '<div class="empty"><i class="ti ti-chart-bar"></i>Sin jugadores aún</div>';
  const pl = D.players.find(p => p.id===statsFilt);
  if (!pl) return chips;
  const s = pStats(statsFilt), idx = D.players.findIndex(p => p.id===statsFilt), ac = av(idx);
  const stxt = s.streak>0 && s.stype ? `${s.streak} ${s.stype==='won'?'victoria':'derrota'}${s.streak>1?'s':''} seguida${s.streak>1?'s':''}` : 'Sin racha';
  const sc = s.stype==='won'?'cg':s.stype==='lost'?'cr':'';
  const chart = buildChart(s.bs);
  return chips + `
    <div class="card" style="display:flex;align-items:center;gap:12px;margin-bottom:10px;">
      <div class="ava" style="width:52px;height:52px;font-size:17px;background:${ac.bg};color:${ac.tx};">${ini(pl.name)}</div>
      <div>
        <div style="font-size:18px;font-weight:600;">${pl.name}</div>
        <div style="font-size:13px;" class="${s.net>=0?'cg':'cr'}">${s.net>=0?'+':''}${fmt(s.net)}€ beneficio neto</div>
      </div>
    </div>
    <div class="sg">
      <div class="sb"><div class="sb-l">Total apuestas</div><div class="sb-v">${s.tot}</div></div>
      <div class="sb"><div class="sb-l">% de acierto</div><div class="sb-v">${s.pct}%</div></div>
      <div class="sb"><div class="sb-l">Ganadas</div><div class="sb-v cg">${s.won}</div></div>
      <div class="sb"><div class="sb-l">Falladas</div><div class="sb-v cr">${s.lost}</div></div>
    </div>
    <div class="card" style="margin-bottom:10px;">
      <div style="font-size:11px;color:var(--txt2);margin-bottom:4px;">Racha actual</div>
      <div style="font-size:16px;font-weight:500;" class="${sc}">${stxt}</div>
    </div>
    <div class="card" style="margin-bottom:10px;">
      <div style="font-size:11px;color:var(--txt2);margin-bottom:4px;">Pendientes de resultado</div>
      <div style="font-size:16px;font-weight:500;">${s.pending} apuesta${s.pending!==1?'s':''}</div>
    </div>${chart}`;
}
function setSF(id) { statsFilt = id; if(curTab==='stats') renderTab(); }

function buildChart(bets) {
  const res = [...bets].filter(b=>b.res!=='pending').sort((a,b)=>new Date(a.date)-new Date(b.date));
  if (res.length < 2) return '';
  let c = 0;
  const pts = res.map(b => { c += b.res==='won' ? (b.gain||0)-1 : -1; return {v:+c.toFixed(2),r:b.res}; });
  const vals = pts.map(p=>p.v), mn=Math.min(...vals,0), mx=Math.max(...vals,0), rng=mx-mn||1;
  const W=320, H=70, px=6;
  const xs=i=>px+i*(W-px*2)/(pts.length-1), ys=v=>H-px-((v-mn)/rng)*(H-px*2);
  const poly = pts.map((p,i)=>`${xs(i)},${ys(p.v)}`).join(' ');
  const z=ys(0), lc=vals[vals.length-1]>=0?'#639922':'#c0392b';
  return `<div class="card">
    <div style="font-size:11px;color:var(--txt2);margin-bottom:8px;">Evolución del saldo</div>
    <svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}">
      <line x1="${px}" y1="${z}" x2="${W-px}" y2="${z}" stroke="#333" stroke-width="0.5" stroke-dasharray="3"/>
      <polyline points="${poly}" fill="none" stroke="${lc}" stroke-width="2"/>
      ${pts.map((p,i)=>`<circle cx="${xs(i)}" cy="${ys(p.v)}" r="3" fill="${p.r==='won'?'#639922':'#c0392b'}"/>`).join('')}
    </svg>
    <div style="display:flex;justify-content:space-between;font-size:10px;color:var(--txt2);margin-top:4px;">
      <span>${res[0]?.date||''}</span><span>${res[res.length-1]?.date||''}</span>
    </div>
  </div>`;
}

// ─── Admin ───────────────────────────────────────────────
function renderAdmin() {
  if (!authed) return `
    <div class="card">
      <div class="card-title">Acceso administrador</div>
      <label>Contraseña</label>
      <input type="password" id="pw-in" placeholder="Contraseña" onkeydown="if(event.key==='Enter')doLogin()"/>
      <button class="btn btn-g btn-full" onclick="doLogin()">Entrar</button>
      <div id="pw-err" style="display:none;color:var(--red-l);font-size:13px;margin-top:6px;"><i class="ti ti-alert-circle"></i> Contraseña incorrecta</div>
    </div>`;

  const pending = D.bets.filter(b => b.res==='pending');
  const apiOk = !!D.cfg.apiKey;

  return `
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">
      <div style="font-size:12px;font-weight:500;color:var(--txt2);text-transform:uppercase;letter-spacing:.05em;">Panel admin</div>
      <button class="btn btn-sm" onclick="logout()">Salir</button>
    </div>

    <div class="card">
      <div class="card-title">Configuración</div>
      <label>Nombre del grupo</label>
      <input type="text" id="cfg-name" value="${D.cfg.name||''}"/>
      <label>Temporada</label>
      <input type="text" id="cfg-season" value="${D.cfg.season||''}"/>
      <label>API Key de Google Gemini <span style="color:var(--txt3);font-size:10px;">(gratuita, necesaria para leer tickets)</span></label>
      <input type="password" id="cfg-apikey" value="${D.cfg.apiKey||''}" placeholder="AIza..."/>
      <div style="font-size:11px;color:var(--txt2);margin-bottom:10px;">Obtén tu clave gratuita en <strong>aistudio.google.com</strong> → Get API key</div>
      <button class="btn btn-g btn-full" onclick="saveCfg()">Guardar configuración</button>
    </div>

    <div class="card">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">
        <div class="card-title" style="margin:0;">Jugadores (${D.players.length})</div>
        <button class="btn btn-g btn-sm" onclick="goAddPlayer()"><i class="ti ti-plus"></i> Añadir</button>
      </div>
      ${!D.players.length ? '<div style="font-size:14px;color:var(--txt2);">Sin jugadores aún</div>' : ''}
      ${D.players.map((p,i) => {
        const ac = av(i);
        return `<div class="irow">
          <div class="ava" style="width:32px;height:32px;font-size:11px;background:${ac.bg};color:${ac.tx};">${ini(p.name)}</div>
          <span style="flex:1;">${p.name}</span>
          <button class="btn btn-sm btn-r" onclick="delPlayer('${p.id}')"><i class="ti ti-trash"></i></button>
        </div>`;
      }).join('')}
    </div>

    <div class="card">
      <div class="card-title">Pendientes de resultado (${pending.length})</div>
      ${!pending.length ? '<div style="font-size:14px;color:var(--txt2);">Ninguna apuesta pendiente</div>' : ''}
      ${pending.map(b => {
        const pl = D.players.find(p => p.id===b.pid);
        return `<div class="irow">
          <div style="flex:1;min-width:0;">
            <div style="font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${b.desc||'Sin descripción'}</div>
            <div style="font-size:11px;color:var(--txt2);">${pl?.name||'?'} · apostado ${fmt(b.stake||1)}€ · pot. +${fmt(b.gain)}€</div>
          </div>
          <button class="btn btn-sm" style="margin-right:4px;" onclick="goResult('${b.id}')">Resultado</button>
          <button class="btn btn-sm btn-r" onclick="delBet('${b.id}')"><i class="ti ti-trash"></i></button>
        </div>`;
      }).join('')}
    </div>

    <button class="btn btn-g btn-full" onclick="goAddBet()"><i class="ti ti-plus"></i> Añadir nueva apuesta</button>`;
}

function doLogin() {
  const pw = document.getElementById('pw-in')?.value;
  if (pw === D.cfg.adminPw || pw === 'admin123') { authed = true; renderTab(); }
  else { const e = document.getElementById('pw-err'); if(e) e.style.display='block'; }
}
function logout() { authed = false; renderTab(); }

function goAddPlayer() {
  document.getElementById('np-name').value = '';
  showView('v-addplayer');
  setTimeout(() => document.getElementById('np-name').focus(), 100);
}
function savePlayer() {
  const n = document.getElementById('np-name').value.trim();
  if (!n) { alert('Escribe un nombre'); return; }
  D.players.push({ id:'p'+Date.now(), name:n });
  saveData(); goMain();
}

function goAddBet() {
  const sel = document.getElementById('nb-player');
  sel.innerHTML = '<option value="">Seleccionar jugador...</option>' +
    D.players.map(p => `<option value="${p.id}">${p.name}</option>`).join('');
  document.getElementById('nb-desc').value = '';
  document.getElementById('nb-gain').value = '';
  document.getElementById('nb-gain').classList.remove('input-ok');
  document.getElementById('nb-stake').value = '1.00';
  document.getElementById('nb-date').value = new Date().toISOString().split('T')[0];
  document.getElementById('ai-status').style.display = 'none';
  document.getElementById('ai-badge').style.display = 'none';
  document.getElementById('photo-zone').innerHTML = `
    <i class="ti ti-camera" style="font-size:32px;color:var(--txt2);display:block;margin-bottom:6px;"></i>
    <div style="font-size:14px;color:var(--txt2);">Toca para subir la foto</div>
    <div style="font-size:12px;color:var(--txt3);margin-top:4px;">La IA leerá la ganancia automáticamente</div>`;
  curPhoto = null;
  showView('v-addbet');
}

function saveBet() {
  const pid = document.getElementById('nb-player').value;
  const desc = document.getElementById('nb-desc').value.trim();
  const gain = parseFloat(document.getElementById('nb-gain').value);
  const stake = parseFloat(document.getElementById('nb-stake').value) || 1;
  const date = document.getElementById('nb-date').value;
  if (!pid) { alert('Selecciona un jugador'); return; }
  if (!desc) { alert('Añade una descripción'); return; }
  if (!gain || gain <= 0) { alert('Introduce la ganancia potencial'); return; }
  D.bets.push({ id:'b'+Date.now(), pid, desc, gain, stake, date, photo:curPhoto, res:'pending' });
  saveData(); goMain();
}

function goResult(id) {
  curBetId = id;
  const b = D.bets.find(x => x.id===id), pl = D.players.find(p => p.id===b?.pid);
  document.getElementById('result-desc').textContent = b?.desc || 'Sin descripción';
  document.getElementById('result-sub').textContent = `${pl?.name||'?'} · apostado: ${fmt(b?.stake||1)}€ · ganancia potencial: ${fmt(b?.gain)}€`;
  showView('v-result');
}
function setResult(res) {
  const b = D.bets.find(x => x.id===curBetId);
  if (b) { b.res = res; saveData(); }
  goMain();
}

function delPlayer(id) {
  if (!confirm('¿Eliminar jugador y todas sus apuestas?')) return;
  D.players = D.players.filter(p => p.id!==id);
  D.bets = D.bets.filter(b => b.pid!==id);
  saveData(); renderTab();
}
function delBet(id) {
  if (!confirm('¿Eliminar esta apuesta?')) return;
  D.bets = D.bets.filter(b => b.id!==id);
  saveData(); renderTab();
}
function saveCfg() {
  D.cfg.name = document.getElementById('cfg-name').value.trim() || 'Liga de Apuestas';
  D.cfg.season = document.getElementById('cfg-season').value.trim();
  D.cfg.apiKey = document.getElementById('cfg-apikey').value.trim();
  saveData();
  document.getElementById('hdr-name').textContent = D.cfg.name;
  document.getElementById('hdr-season').textContent = D.cfg.season;
  alert('¡Guardado!');
}

// ─── Photo + AI ──────────────────────────────────────────
async function onPhoto(input) {
  if (!input.files || !input.files[0]) return;
  const file = input.files[0];

  // Show preview
  const previewB64 = await shrink(file, 300);
  curPhoto = previewB64;
  document.getElementById('photo-zone').innerHTML = `<img src="${previewB64}" alt="ticket"/>`;

  // Check API key
  const apiKey = D.cfg.apiKey;
  if (!apiKey) {
    showAIStatus('err', 'Sin clave Gemini — configúrala en Admin. Introduce los datos manualmente.');
    return;
  }

  showAIStatus('loading', 'Analizando ticket con IA (Gemini)...');

  try {
    const fullB64 = await toB64(file);
    const base64Data = fullB64.split(',')[1];
    const mimeType = file.type || 'image/jpeg';

    const prompt = `Eres un experto en leer tickets de apuestas deportivas.
Analiza esta imagen y extrae los datos del ticket.
Responde ÚNICAMENTE con JSON puro, sin markdown, sin texto extra.
Formato exacto: {"importe_apostado": número_o_null, "ganancia_total": número_o_null, "descripcion": "texto_o_null"}
- "importe_apostado": cantidad arriesgada (stake, apuesta). Si no aparece, devuelve null.
- "ganancia_total": lo que recibirías si ganas en total (incluyendo la apuesta). Busca: ganancia, retorno, premio, beneficio potencial, "to win", "potential return", "winnings". Devuelve el número mayor que aparezca como retorno.
- "descripcion": descripción breve del evento apostado (ej: "Real Madrid - Barça, victoria local").
Si no puedes leer un campo con seguridad, pon null.`;

    // Prueba modelos en orden — gemini-1.5-flash funciona en el tier gratuito
    const models = ['gemini-1.5-flash-latest', 'gemini-2.0-flash-lite', 'gemini-2.0-flash'];
    let data = null, lastErr = '';
    for (const model of models) {
      showAIStatus('loading', 'Analizando con IA (' + model + ')...');
      const resp = await fetch(
        'https://generativelanguage.googleapis.com/v1beta/models/' + model + ':generateContent?key=' + apiKey,
        {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [
              { inline_data: { mime_type: mimeType, data: base64Data } },
              { text: prompt }
            ]}],
            generationConfig: { temperature: 0, maxOutputTokens: 300 }
          })
        }
      );
      if (resp.ok) { data = await resp.json(); break; }
      const errBody = await resp.json().catch(() => ({}));
      lastErr = errBody.error?.message || ('Error ' + resp.status);
      const isQuota = lastErr.toLowerCase().includes('quota') || resp.status === 429 || lastErr.includes('RESOURCE_EXHAUSTED');
      if (!isQuota) throw new Error(lastErr);
    }
    if (!data) throw new Error('Sin cuota disponible en ningún modelo. Espera unos minutos.');

    const text = data.candidates?.[0]?.content?.parts?.[0]?.text || '{}';
    let parsed;
    try { parsed = JSON.parse(text.replace(/```json|```/g,'').trim()); }
    catch(e) { throw new Error('Respuesta no válida de la IA'); }

    let filled = [];

    if (parsed.importe_apostado && parsed.importe_apostado > 0) {
      document.getElementById('nb-stake').value = parseFloat(parsed.importe_apostado).toFixed(2);
      filled.push(`apostado: ${parseFloat(parsed.importe_apostado).toFixed(2)}€`);
    }

    if (parsed.ganancia_total && parsed.ganancia_total > 0) {
      document.getElementById('nb-gain').value = parseFloat(parsed.ganancia_total).toFixed(2);
      document.getElementById('nb-gain').classList.add('input-ok');
      document.getElementById('ai-badge').style.display = 'block';
      filled.push(`ganancia: ${parseFloat(parsed.ganancia_total).toFixed(2)}€`);
    }

    if (parsed.descripcion && !document.getElementById('nb-desc').value) {
      document.getElementById('nb-desc').value = parsed.descripcion;
    }

    if (filled.length > 0) {
      showAIStatus('ok', `Detectado — ${filled.join(' · ')} — revisa antes de guardar`);
    } else {
      showAIStatus('err', 'No se detectaron importes. Introdúcelos manualmente.');
    }

  } catch(e) {
    showAIStatus('err', 'Error: ' + (e.message || 'Inténtalo de nuevo'));
    console.error(e);
  }
}

function showAIStatus(type, msg) {
  const el = document.getElementById('ai-status');
  el.style.display = 'flex';
  const icon = type==='loading' ? '<i class="ti ti-loader spin"></i>' : type==='ok' ? '<i class="ti ti-check"></i>' : '<i class="ti ti-alert-triangle"></i>';
  el.className = 'ai-box ai-' + type;
  el.innerHTML = icon + ' <span>' + msg + '</span>';
}

function toB64(f) {
  return new Promise(r => { const fr=new FileReader(); fr.onload=e=>r(e.target.result); fr.readAsDataURL(f); });
}
function shrink(f, mx) {
  return new Promise(r => {
    const fr = new FileReader();
    fr.onload = e => {
      const img = new Image();
      img.onload = () => {
        const c = document.createElement('canvas');
        let w=img.width, h=img.height;
        if (w>h && w>mx){h=h*mx/w;w=mx;} else if(h>mx){w=w*mx/h;h=mx;}
        c.width=w; c.height=h;
        c.getContext('2d').drawImage(img,0,0,w,h);
        r(c.toDataURL('image/jpeg', 0.8));
      };
      img.src = e.target.result;
    };
    fr.readAsDataURL(f);
  });
}

// ─── Init ────────────────────────────────────────────────
document.getElementById('hdr-name').textContent = D.cfg.name || 'Liga de Apuestas';
document.getElementById('hdr-season').textContent = D.cfg.season || '';
renderTab();
</script>
